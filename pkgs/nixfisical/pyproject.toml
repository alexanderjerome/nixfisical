[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nixfisical"
version = "0.1.0"
description = "Declarative bootstrap and reconciliation for a self-hosted Infisical instance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexander Jerome" }]
keywords = ["infisical", "sops", "nixos", "secrets"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
nixfisical = "nixfisical.cli:cli"
# The host-side agent. A separate entry point because it is a separate
# audience: `nixfisical` runs on an operator's machine and needs sops and git,
# the agent runs on every host that injects directly and must not drag either
# of them into that host's closure. See `minimal` in nix/pkgs/nixfisical.nix.
nixfisical-agent = "nixfisical.agent:main"
# The MCP server. Operator-side like `nixfisical` itself, and wrapped the same
# way: `sync_diff` runs a real dry run, and a dry run decrypts every SOPS value
# it would push, so this needs sops on PATH exactly as the CLI does. A separate
# entry point rather than a `nixfisical mcp` subcommand because an MCP client's
# stdio transport owns the whole process — the binary a `.mcp.json` names has
# to be the server and nothing else, and a subcommand invites a wrapper script
# whose stray output is a parse error at the client.
nixfisical-mcp = "nixfisical.mcp:main"
# The host-side half of `nixfisical keyring`, and only that half. A host that
# could push to the keyring would be a host that could replace the key the
# entire estate is encrypted to, so the upload stays in the operator CLI that
# `minimal` deletes and this one only pulls and installs.
nixfisical-keyring-install = "nixfisical.keyring:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nixfisical*"]
